<div class="container">

  <!-- Profile Content -->
  <div class="profile-content">
    <!-- Profile Card -->
    <div class="profile-card">
      <!-- Profile Photo -->
      <div class="profile-photo-container">
        <div class="photo-wrapper">
          <img
          [src]="user?.logo?.secureUrl || '../../../assets/images/profile.png'"
          [alt]="user?.name || 'Foto de perfil'"
          class="profile-photo"
        />
          <span class="online-status"></span>
        </div>
      </div>

      <!-- Profile Info -->
      <div class="profile-info">
        <h1 class="profile-name">{{ user?.name }} {{ user?.lastName }}</h1>

        <!-- Social Links -->
        <div class="social-links">
          <span class="social-link" aria-label="Twitch" role="img">
            <i class="fa fa-twitch" aria-hidden="true"></i>
          </span>
          <span class="social-link" aria-label="YouTube" role="img">
            <i class="fa fa-youtube" aria-hidden="true"></i>
          </span>
        </div>

        <!-- Edit Button -->
        <button type="button" class="btn-edit-profile" (click)="onEdit()">
          <i class="fa fa-pencil me-2" aria-hidden="true"></i>
          Editar perfil
        </button>
      </div>
    </div>

    <!-- Team Card -->
    <div class="team-info-card">
      <div class="card-inner">
        <div class="card-glow"></div>

        @if (team?.id != null) {
        <div class="team-content">
          <h3 class="team-card-title" >
            <i class="bi bi-people-fill me-2"></i>
            Mi Equipo
          </h3>

          <div class="team-info">
            <div class="team-logo-section">
              <div class="team-logo-wrapper">
                <img
                  [src]="
                    team?.logo?.secureUrl ||
                    '../../../assets/images/player-default.png'
                  "
                  [alt]="team?.name || 'Logo del equipo'"
                  class="team-logo-image"
                />
              </div>
              <h4 class="team-name">{{ team?.name }}</h4>
            </div>

            <button type="button" class="btn-edit-team">
              <i class="fa fa-pencil me-2" aria-hidden="true"></i>
              Editar equipo
            </button>
          </div>
        </div>
        } @else {
        <div class="team-content">
          <h3 class="team-card-title" >
            <i class="bi bi-people-fill me-2"></i>
            No tienes un equipo asignado
          </h3>
        </div>
        }
      </div>
    </div>
  </div>
</div>
