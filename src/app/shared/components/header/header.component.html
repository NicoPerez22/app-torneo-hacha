<nav
  class="navbar navbar-expand-lg navbar-dark bg-black sticky-top"
  [class.shadow-sm]="isScrolled()"
  aria-label="Navegación principal"
>
  <div class="container">
    <!-- Logo / Brand -->
    <a
      class="navbar-brand d-flex align-items-center gap-2"
      routerLink="/home"
      (click)="onCollapseMobileMenu()"
    >
      <img
        src="../../../../assets/images/seaneternos2.png"
        alt="Sean Eternos"
        width="40"
        height="40"
      />
      <span class="fw-semibold d-none d-sm-inline">Sean Eternos</span>
    </a>

    <!-- Perfil + Dropdown (alineado a la derecha en desktop) -->
    <div class="d-flex align-items-center gap-3 order-lg-3">
      <!-- Icono (ejemplo) -->
      <button
        type="button"
        class="btn border-0 p-0 text-light d-none d-md-inline-flex"
        aria-label="Mensajes"
        title="Mensajes"
      >
        <i class="bi bi-envelope-fill fs-5" aria-hidden="true"></i>
      </button>

      <!-- Avatar + nombre + dropdown -->
      <div class="dropdown">
        <button
          type="button"
          class="btn border-0 p-0 d-flex align-items-center text-decoration-none text-white dropdown-toggle gap-1"
          id="userDropdown"
          data-bs-toggle="dropdown"
          aria-expanded="false"
          aria-haspopup="menu"
        >
          <img
            [src]="
              userSignal()?.teams?.[0]?.logo?.secureUrl ||
              '../../../assets/images/profile.png'
            "
            [alt]="'Perfil de ' + (userSignal()?.name || 'usuario')"
            width="30"
            height="35"
          />
          <span class="d-none d-sm-inline">{{ userSignal()?.name }}</span>
        </button>
        <ul
          class="dropdown-menu dropdown-menu-end"
          aria-labelledby="userDropdown"
        >
          <li>
            <button
              type="button"
              class="dropdown-item"
              (click)="onNavigateToProfile()"
            >
              <i class="fa fa-user" aria-hidden="true"></i>
              Mi Perfil
            </button>
          </li>

          <li>
            <button
              type="button"
              class="dropdown-item"
              (click)="onNavigateToTeam()"
            >
              <i class="fa fa-shield me-1" aria-hidden="true"></i> Mi Equipo
            </button>
          </li>

          <li><hr class="dropdown-divider" /></li>
          <li>
            <button
              type="button"
              class="dropdown-item"
              (click)="onLogout()"
            >
              Cerrar sesión
            </button>
          </li>
        </ul>
      </div>
    </div>

    <!-- Toggler -->
    <button
      class="navbar-toggler ms-2 order-lg-2"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#mainNav"
      aria-controls="mainNav"
      aria-expanded="false"
      aria-label="Alternar navegación"
      #navToggler
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Menú centrado (collapse) -->
    <div class="collapse navbar-collapse order-lg-2" id="mainNav" #mainNav>
      <ul class="navbar-nav mx-lg-auto text-center gap-lg-2">
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/home"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="onCollapseMobileMenu()"
          >
            <i class="fa fa-home me-1" aria-hidden="true"></i> Inicio
          </a>
        </li>

        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/tournament"
            routerLinkActive="active"
            (click)="onCollapseMobileMenu()"
          >
            <i class="fa fa-trophy me-1" aria-hidden="true"></i> Torneos
          </a>
        </li>

        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/equipos"
            routerLinkActive="active"
            (click)="onCollapseMobileMenu()"
          >
            <i class="fa fa-shield me-1" aria-hidden="true"></i> Equipos
          </a>
        </li>

        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/mercado-transferencias"
            routerLinkActive="active"
            (click)="onCollapseMobileMenu()"
          >
            <i class="fa fa-users me-1" aria-hidden="true"></i> Mercado
            Transferencias
          </a>
        </li>

        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/inhabilitados"
            routerLinkActive="active"
            (click)="onCollapseMobileMenu()"
          >
            <i class="fa fa-ban me-1" aria-hidden="true"></i> Inhabilitados
          </a>
        </li>

        @if (userSignal()?.idRol === 1) {
          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/dashboard"
              routerLinkActive="active"
              (click)="onCollapseMobileMenu()"
            >
              <i class="fa fa-dashboard me-1" aria-hidden="true"></i> Dashboard
            </a>
          </li>
        }
      </ul>
    </div>
  </div>
</nav>
