<div class="container">
  <form [formGroup]="form" nz-form nzLayout="vertical" (ngSubmit)="onSubmit()">
    <div class="row">
      <div class="col-md-4">
        <nz-form-item>
          <nz-form-label nzFor="teams">Equipos Origen</nz-form-label>
          <nz-form-control>
            <nz-select
              formControlName="teamOrigin"
              (ngModelChange)="onChangeTeam()"
            >
              @for (item of teams; track item.id) {
              <nz-option
                [nzValue]="item.id"
                [nzLabel]="item.name"
              ></nz-option>
              }
            </nz-select>
          </nz-form-control>
        </nz-form-item>
      </div>

      <div class="col-md-4">
        <nz-form-item>
          <nz-form-label nzFor="teams">Juagdores</nz-form-label>
          <nz-form-control>
            <nz-select formControlName="player">
              @for (item of players; track item.id) {
              <nz-option
                [nzValue]="item.id"
                [nzLabel]="item.name"
              ></nz-option>
              }
            </nz-select>
          </nz-form-control>
        </nz-form-item>
      </div>

      <div class="col-md-4">
        <nz-form-item>
          <nz-form-label nzFor="teams">Equipo Destino</nz-form-label>
          <nz-form-control>
            <nz-select formControlName="teamDestination">
              @for (item of teams; track item.id) {
              <nz-option
                [nzValue]="item.id"
                [nzLabel]="item.name"
              ></nz-option>
              }
            </nz-select>
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>

    <div class="row d-flex justify-content-center">
      <div class="col-md-2">
        <button class="btn btn-warning" type="submit">Confirmar</button>
      </div>
    </div>
  </form>
</div>
