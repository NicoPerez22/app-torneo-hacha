@let user = userSignal();

<div class="wrapper">
  @if (user !== null) {
    <header>
      <app-header />
    </header>
  }

  <main class="content">
    <router-outlet />
  </main>

  @if (user !== null) {
    <footer class="footer bg-black back text-light py-4">
      <div class="container">
        <div class="text-center mt-3">
          <p class="mb-0">&copy; 2026 Todos los derechos reservados.</p>
        </div>
      </div>
    </footer>
  }
</div>

<ngx-spinner
  bdColor="rgba(51,51,51,0.8)"
  size="medium"
  color="#fff"
  type="ball-scale-multiple"
>
</ngx-spinner>
