<div class="auth-container">
  <div class="auth-card">
    <div class="auth-card-inner">
      <div class="logo-section">
        <h1 class="auth-title">Restablecer contraseña</h1>
      </div>
      <form
        *ngIf="!success"
        [formGroup]="form"
        (ngSubmit)="submit()"
        class="auth-form"
      >
        <div class="form-group">
          <label class="form-label" for="recovery-token"
            >Token del administrador</label
          ><textarea
            id="recovery-token"
            formControlName="token"
            class="form-input"
            rows="3"
            autocomplete="off"
            spellcheck="false"
            [readOnly]="saving"
          ></textarea
          ><small
            class="text-danger"
            *ngIf="form.controls.token.touched && form.controls.token.invalid"
            >Ingresá el token que te entregó el administrador.</small
          >
        </div>
        <div class="form-group">
          <label class="form-label" for="new-password">Nueva contraseña</label
          ><input
            id="new-password"
            type="password"
            formControlName="newPassword"
            autocomplete="new-password"
            class="form-input"
            [readOnly]="saving"
          /><small
            class="text-danger"
            *ngIf="
              form.controls.newPassword.touched &&
              form.controls.newPassword.invalid
            "
            >Ingresá tu nueva contraseña.</small
          >
        </div>
        <div class="form-group">
          <label class="form-label" for="confirm-password"
            >Confirmar nueva contraseña</label
          ><input
            id="confirm-password"
            type="password"
            formControlName="confirmPassword"
            autocomplete="new-password"
            class="form-input"
            [readOnly]="saving"
          /><small
            class="text-danger"
            *ngIf="
              form.controls.confirmPassword.touched &&
              (form.controls.confirmPassword.invalid ||
                form.hasError('passwordMismatch'))
            "
            >Las contraseñas deben coincidir.</small
          >
        </div>
        <p *ngIf="error" role="alert" class="text-danger">{{ error }}</p>
        <button class="btn-primary-auth" type="submit" [disabled]="saving">
          {{ saving ? 'Guardando…' : 'Guardar nueva contraseña' }}
        </button>
      </form>
      <p *ngIf="success" role="status" class="auth-subtitle">
        Tu contraseña se actualizó correctamente. Ya podés iniciar sesión con la
        nueva contraseña.
      </p>
      <div class="auth-footer">
        <a class="btn-secondary-auth" routerLink="/auth/login"
          >Volver al login</a
        >
      </div>
    </div>
  </div>
</div>
